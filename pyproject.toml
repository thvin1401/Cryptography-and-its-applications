[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-app"
version = "0.1.0"
description = "A Python application for cryptography"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
